name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/gecut_cloud"
      SESSION_SECRET: "01234567890123456789012345678901"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:3001,http://localhost:3002"
      NODE_ENV: "production"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Type check all workspaces
        run: pnpm check-types

      - name: Build all applications & packages
        run: pnpm build

  docker-validation:
    name: Validate Docker Images
    runs-on: ubuntu-latest
    needs: validate

    strategy:
      matrix:
        include:
          - name: server
            dockerfile: apps/server/Dockerfile
          - name: admin
            dockerfile: apps/admin/Dockerfile
          - name: customer-app
            dockerfile: apps/customer-app/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (${{ matrix.name }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: gecut-cloud/${{ matrix.name }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
