services:
  migration:
    platform: linux/amd64
    image: ghcr.io/gecut/cloud-app/server:${SERVER_TAG:-${TAG:-latest}}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: "no"
    command: ["pnpm", "--filter", "@gecut-cloud/db", "db:migrate:deploy"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/gcloud?schema=public}
    networks:
      - dokploy-network

  server:
    platform: linux/amd64
    image: ghcr.io/gecut/cloud-app/server:${SERVER_TAG:-${TAG:-latest}}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    command: ["sh", "-c", "pnpm --filter @gecut-cloud/db db:migrate:deploy || true && node dist/src/main.js"]
    expose:
      - "3000"
    depends_on:
      migration:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/gcloud?schema=public}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${ADMIN_DOMAIN:-admin.app.gecut.ir},https://admin.app.gecut.ir,https://${CUSTOMER_APP_DOMAIN:-app.gecut.ir},https://app.gecut.ir,https://${SERVER_DOMAIN:-api.app.gecut.ir},https://api.app.gecut.ir,https://admin.cloud.gecut.ir,https://app.cloud.gecut.ir,http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5173}
      SESSION_SECRET: ${SESSION_SECRET:-super-secret-development-session-key-must-be-32-chars-long}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-gecut_session}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-46437751615871547A59364B75376339706E72384266734A596F3476644B653641356171462F557A5747383D}
      KAVENEGAR_OTP_TEMPLATE: ${KAVENEGAR_OTP_TEMPLATE:-gcotp}
      SERVER_URL: ${SERVER_URL:-https://${SERVER_DOMAIN:-api.app.gecut.ir}}
      CUSTOMER_APP_URL: ${CUSTOMER_APP_URL:-https://${CUSTOMER_APP_DOMAIN:-app.gecut.ir}}
    volumes:
      - gecut_cloud_server_data:/app/apps/server/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.server.rule=Host(`${SERVER_DOMAIN:-api.app.gecut.ir}`)"
      - "traefik.http.routers.server.entrypoints=websecure"
      - "traefik.http.routers.server.tls=true"
      - "traefik.http.routers.server.tls.certresolver=letsencrypt"
      - "traefik.http.services.server.loadbalancer.server.port=3000"
    networks:
      - dokploy-network

  admin:
    platform: linux/amd64
    image: ghcr.io/gecut/cloud-app/admin:${ADMIN_TAG:-${TAG:-latest}}
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-https://${SERVER_DOMAIN:-api.app.gecut.ir}}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - server
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`${ADMIN_DOMAIN:-admin.app.gecut.ir}`)"
      - "traefik.http.routers.admin.entrypoints=websecure"
      - "traefik.http.routers.admin.tls=true"
      - "traefik.http.routers.admin.tls.certresolver=letsencrypt"
      - "traefik.http.services.admin.loadbalancer.server.port=80"
    networks:
      - dokploy-network

  customer-app:
    platform: linux/amd64
    image: ghcr.io/gecut/cloud-app/customer-app:${CUSTOMER_APP_TAG:-${TAG:-latest}}
    build:
      context: .
      dockerfile: apps/customer-app/Dockerfile
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-https://${SERVER_DOMAIN:-api.app.gecut.ir}}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - server
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.customer.rule=Host(`${CUSTOMER_APP_DOMAIN:-app.gecut.ir}`)"
      - "traefik.http.routers.customer.entrypoints=websecure"
      - "traefik.http.routers.customer.tls=true"
      - "traefik.http.routers.customer.tls.certresolver=letsencrypt"
      - "traefik.http.services.customer.loadbalancer.server.port=80"
    networks:
      - dokploy-network

volumes:
  gecut_cloud_server_data:
    name: gecut_cloud_server_data

networks:
  dokploy-network:
    external: true