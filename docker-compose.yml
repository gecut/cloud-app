services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-gcloud}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gcloud}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:8.10.2-alpine3.23
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  server:
    image: ghcr.io/gecut/cloud-app/server:${SERVER_TAG:-${TAG:-0.4.23}}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/gcloud?schema=public}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${ADMIN_DOMAIN:-admin.app.gecut.ir},https://${CUSTOMER_APP_DOMAIN:-app.gecut.ir},https://admin.cloud.gecut.ir,https://app.cloud.gecut.ir,https://${SERVER_DOMAIN:-api.app.gecut.ir}}
      SESSION_SECRET: ${SESSION_SECRET:-super-secret-development-session-key-must-be-32-chars-long}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-gecut_session}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
    volumes:
      - server_data:/app/apps/server/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gecut-server.rule=Host(`${SERVER_DOMAIN:-api.app.gecut.ir}`)"
      - "traefik.http.routers.gecut-server.entrypoints=websecure"
      - "traefik.http.routers.gecut-server.tls.certResolver=letsencrypt"
      - "traefik.http.services.gecut-server.loadbalancer.server.port=3000"

  admin:
    image: ghcr.io/gecut/cloud-app/admin:${ADMIN_TAG:-${TAG:-0.4.23}}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - server
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gecut-admin.rule=Host(`${ADMIN_DOMAIN:-admin.app.gecut.ir}`)"
      - "traefik.http.routers.gecut-admin.entrypoints=websecure"
      - "traefik.http.routers.gecut-admin.tls.certResolver=letsencrypt"
      - "traefik.http.services.gecut-admin.loadbalancer.server.port=80"

  customer-app:
    image: ghcr.io/gecut/cloud-app/customer-app:${CUSTOMER_APP_TAG:-${TAG:-0.4.23}}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - server
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gecut-customer.rule=Host(`${CUSTOMER_APP_DOMAIN:-app.gecut.ir}`)"
      - "traefik.http.routers.gecut-customer.entrypoints=websecure"
      - "traefik.http.routers.gecut-customer.tls.certResolver=letsencrypt"
      - "traefik.http.services.gecut-customer.loadbalancer.server.port=80"

volumes:
  postgres_data:
  redis_data:
  server_data:

networks:
  internal:
    driver: bridge
  dokploy-network:
    external: true